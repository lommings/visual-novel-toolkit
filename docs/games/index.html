<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl 的視覺小說作品集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 1.2em;
            margin-bottom: 60px;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        
        .game-thumbnail {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
        }
        
        .game-info {
            padding: 20px;
        }
        
        .game-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .game-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .play-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        
        .play-button:hover {
            opacity: 0.8;
        }
        
        .footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Pearl 的視覺小說作品集</h1>
        <p class="subtitle">用 Visual Novel Toolkit 創作的互動式故事</p>
        
        <div class="games-grid">
            <!-- 遊戲卡片 1：小花與佳樹 -->
            <div class="game-card" onclick="location.href='./小花與佳樹/'">
                <div class="game-thumbnail">🌸</div>
                <div class="game-info">
                    <div class="game-title">小花與佳樹</div>
                    <div class="game-description">
                        東京的春天，轉學生花子在新學校遭遇霸凌。
                        在最絕望時，她遇見了圖書館的幽靈佳樹...
                    </div>
                    <a href="./小花與佳樹/" class="play-button">開始遊戲 →</a>
                </div>
            </div>
            
            <!-- 可以繼續添加更多遊戲 -->
            <!-- 
            <div class="game-card" onclick="location.href='./遊戲名稱/'">
                <div class="game-thumbnail">🎭</div>
                <div class="game-info">
                    <div class="game-title">遊戲標題</div>
                    <div class="game-description">
                        遊戲簡介...
                    </div>
                    <a href="./遊戲名稱/" class="play-button">開始遊戲 →</a>
                </div>
            </div>
            -->
        </div>
        
        <div class="footer">
            <p>由 <strong>Pearl</strong> 使用 <a href="https://github.com/lommings/visual-novel-toolkit" style="color: white;">Visual Novel Toolkit</a> 創作</p>
            <p style="margin-top: 10px; opacity: 0.7;">© 2026 All rights reserved</p>
        </div>
    </div>
</body>
</html>
